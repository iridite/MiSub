name: Deploy MiSub

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

# 同一分支只跑一个部署：连续推送时取消旧 run，避免旧提交的部署晚于新提交完成。
# Pages 每次部署是原子替换，取消进行中的 run 随时安全（上一个成功部署保持在线）。
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Require delivered-config hardening
        run: |
          set -euo pipefail
          test -f functions/modules/subscription/clash-hardening.js
          grep -q "DEFAULT_DNS_LISTEN" functions/modules/subscription/safe-dns.js

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:run -- --reporter=dot

      - name: Generate Wrangler config
        env:
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ vars.MISUB_KV_ID }}
        run: |
          set -euo pipefail
          # 仓库变量缺失时直接说明缺哪个，而不是留一个裸 exit code 1
          : "${ACCOUNT_ID:?missing repository variable CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions → Variables)}"
          : "${KV_NAMESPACE_ID:?missing repository variable MISUB_KV_ID (Settings → Secrets and variables → Actions → Variables)}"
          cat > wrangler.jsonc <<EOF
          {
            "name": "misub",
            "pages_build_output_dir": "./dist",
            "compatibility_date": "2024-04-01",
            "compatibility_flags": ["nodejs_compat"],
            "kv_namespaces": [
              {
                "binding": "MISUB_KV",
                "id": "$KV_NAMESPACE_ID"
              }
            ],
            "vars": {
              "MISUB_PUBLIC_URL": "https://misub.nekorect.eu.org",
              "CORS_ORIGINS": "https://misub.nekorect.eu.org,https://misub-1dk.pages.dev"
            }
          }
          EOF

      - name: Bundle MRS for direct domestic downloads
        run: |
          set -euo pipefail
          mkdir -p public/rules/geoip
          meta=https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo
          fetch_rule() {
            curl --fail --location --retry 3 --retry-all-errors --max-time 60 --silent --show-error \
              --output "public/rules/$1.mrs" "$2"
            test -s "public/rules/$1.mrs"
          }
          fetch_rule private "$meta/geosite/private.mrs"
          fetch_rule apple "$meta/geosite/apple.mrs"
          fetch_rule wechat https://raw.githubusercontent.com/Lanlan13-14/Rules/main/rules/Domain/WeChat.mrs
          fetch_rule ads https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockmihomo.mrs
          fetch_rule ads-lite https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockmihomolite.mrs
          fetch_rule cn-domain "$meta/geosite/cn.mrs"
          fetch_rule foreign "$meta/geosite/geolocation-!cn.mrs"
          fetch_rule geoip/cn "$meta/geoip/cn.mrs"
          # 合并规则集：AWAvenue 取官方发布的 mrs（969 条，误杀最少）；Telegram IP 取 MetaCubeX 聚合集（AI 域名已在 foreign.mrs 内）
          fetch_rule awa https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.mrs
          fetch_rule geoip/telegram "$meta/geoip/telegram.mrs"
          # 自维护直连清单（文本，classical）：上游没有、必须直连的域名，见 public-src/rules/custom-direct.list
          cp public-src/rules/custom-direct.list public/rules/custom-direct.list
          test -s public/rules/custom-direct.list

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            : "${CLOUDFLARE_API_KEY:?missing secret CLOUDFLARE_API_KEY (or set CLOUDFLARE_API_TOKEN instead)}"
            : "${CLOUDFLARE_EMAIL:?missing secret CLOUDFLARE_EMAIL (required when using CLOUDFLARE_API_KEY)}"
          fi
          npx wrangler pages deploy dist --project-name misub --branch main --commit-dirty=true

      - name: Smoke-test published Clash and sing-box subscriptions
        env:
          MISUB_SMOKE_URL: ${{ secrets.MISUB_SMOKE_URL }}
        run: |
          set -euo pipefail
          if [[ -n "${MISUB_SMOKE_URL:-}" ]]; then
            node scripts/smoke-subscription.mjs
          else
            echo "::warning title=Subscription smoke test skipped::MISUB_SMOKE_URL secret is not configured, so the deployed subscription was NOT verified. Add it with: gh secret set MISUB_SMOKE_URL --body '<subscription url>'"
          fi
